allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  sharp: true

minimumReleaseAgeExclude:
  - postcss@8.5.31

overrides:
  brace-expansion@>=5.0.0 <5.0.12: 5.0.12
  dompurify: 3.4.17
  fast-uri@3: 3.1.9
  js-yaml: 3.15.2
  nanoid@3.3.16: 3.3.18
  postcss: 8.5.33
  sharp: 0.35.5
  source-map-js@<1.2.2: 1.2.2
  tmp@<0.2.6: 0.2.7
  uuid@^8: 11.1.1

auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (17/11/2026), no patched version yet. It only reaches the
    # build and dev tooling (@sentry/nextjs > @rollup/plugin-commonjs at build,
    # next-intl > @parcel/watcher in dev), never visitor input. Remove once a
    # patched picomatch ships (Dependabot will open the update).
    - GHSA-fc5q-39xc-vjpf
